<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafaf8" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved (or system) theme before first paint so dark mode never flashes light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bh-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d0d0c');
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Post a job and nearby skilled workers get notified in real time."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BuildHire" />
    <meta property="og:description" content="Post a job and nearby skilled workers get notified in real time." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- The two BuildHire fonts: Syne (headings) and DM Sans (body). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>BuildHire</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
